name: Release

on:
  release:
    types: [published]

env:
  METADATA_BRANCH: metadata
  ASSET_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the version matches the tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(dotnet msbuild source/*.csproj -getProperty:Version -nologo)
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${TAG} does not match <Version> ${VERSION}." >&2
            exit 1
          fi

      - name: Fetch the published manifest
        run: |
          git fetch --no-tags origin "+refs/heads/${METADATA_BRANCH}:refs/remotes/origin/${METADATA_BRANCH}"
          git show "origin/${METADATA_BRANCH}:manifest.json" > manifest.json

      - name: Write the release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: printf '%s' "${RELEASE_BODY}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Restore the build tool
        run: dotnet tool restore

      - name: Build and package
        working-directory: source
        run: |
          dotnet shoko-build \
            --configuration Release \
            --channel Stable \
            --tag "${{ github.event.release.tag_name }}" \
            --release-notes-path "${RUNNER_TEMP}/release-notes.md" \
            --manifest "${GITHUB_WORKSPACE}/manifest.json" \
            --output "${GITHUB_WORKSPACE}/dist/{name}-{tag}-{runtime}.zip" \
            --url "${ASSET_BASE_URL}/{tag}/{name}-{tag}-{runtime}.zip" \
            -- \
            -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --repo "${{ github.repository }}"

      - name: Commit the manifest to the metadata branch
        run: |
          cp manifest.json "${RUNNER_TEMP}/manifest.json"
          git reset --hard
          git checkout -B "${METADATA_BRANCH}" "origin/${METADATA_BRANCH}"
          cp "${RUNNER_TEMP}/manifest.json" manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "ci: update manifest for ${{ github.event.release.tag_name }}"
            git push origin "${METADATA_BRANCH}"
          fi
